<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SOS Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 24px; max-width: 1100px; margin: 0 auto; }
    h1 { margin-top: 0; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
    th { background: #fafafa; position: sticky; top: 0; }
    .pill { padding: 4px 10px; border-radius: 9999px; display: inline-block; }
    .pending { background:#fff7ed; color:#9a3412; }
    .ack { background:#ecfeff; color:#155e75; }
    .solved { background:#ecfdf5; color:#065f46; }
    .row-actions button { margin-right: 6px; }
    form.auth { display:flex; gap:8px; margin: 8px 0 16px; flex-wrap:wrap; }
    input { padding: 8px 10px; border:1px solid #ddd; border-radius:8px; }
    button { padding:8px 12px; border:1px solid #ddd; border-radius:8px; background:#111827; color:white; cursor:pointer; }
    button.secondary { background:white; color:#374151; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <h1>SOS — Admin Alerts</h1>

  <div class="card">
    <h3>Sign in (Email/Password)</h3>
    <form class="auth" id="authForm">
      <input id="email" type="email" placeholder="admin@example.com" required />
      <input id="password" type="password" placeholder="password" required />
      <button type="submit">Sign In</button>
      <button type="button" class="secondary" id="logoutBtn">Sign Out</button>
    </form>
    <div id="authStatus">Not signed in.</div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0">Live Alerts</h3>
      <div>
        <button class="secondary" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div style="overflow:auto; max-height:70vh; margin-top:8px;">
      <table id="alertsTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Type</th>
            <th>Status</th>
            <th>Location</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="alertsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Firebase SDKs (v10 modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // TODO: paste your Firebase Web config here (from Firebase Console → Project settings → "Your apps" (Web))
    const firebaseConfig = {
      apiKey: "AIzaSyDx5eKF9rG1fSmzQT93RjbajuupvmPtLMc",
      authDomain: "sos-admin-3d4ca.firebaseapp.com",
      projectId: "sos-admin-3d4ca",
      storageBucket: "sos-admin-3d4ca.firebasestorage.app",
      messagingSenderId: "817362566965",
      appId: "1:817362566965:web:029ddada4e36b46103d67c",
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // UI refs
    const emailEl = document.getElementById("email");
    const passEl  = document.getElementById("password");
    const authForm= document.getElementById("authForm");
    const logoutBtn = document.getElementById("logoutBtn");
    const authStatus= document.getElementById("authStatus");
    const bodyEl  = document.getElementById("alertsBody");
    const refreshBtn = document.getElementById("refreshBtn");

    function fmtTime(ms) {
      try {
        const d = new Date(ms);
        return d.toLocaleString();
      } catch { return String(ms); }
    }
    function statusPill(s) {
      const cls = s === "solved" ? "solved" : (s === "acknowledged" ? "ack" : "pending");
      return `<span class="pill ${cls}">${s}</span>`;
    }
    function mapsLink(lat, lng) {
      if (typeof lat !== "number" || typeof lng !== "number") return "";
      const url = `https://maps.google.com/?q=${lat},${lng}`;
      return `<a href="${url}" target="_blank" rel="noopener">Open in Maps</a>`;
    }

    async function setStatus(id, status) {
      const ref = doc(db, "alerts", id);
      await updateDoc(ref, { status });
    }

    function draw(rows) {
      bodyEl.innerHTML = rows.map(r => `
        <tr>
          <td>${fmtTime(r.createdAt ?? 0)}</td>
          <td>${r.type ?? ""}</td>
          <td>${statusPill(r.status ?? "pending")}</td>
          <td>
            ${typeof r.lat === "number" && typeof r.lng === "number"
              ? `${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}<br>${mapsLink(r.lat, r.lng)}`
              : "—"}
          </td>
          <td class="row-actions">
            <button onclick="window._ack('${r.id}')">Acknowledge</button>
            <button onclick="window._solve('${r.id}')">Solved</button>
            <button class="secondary" onclick="window._pending('${r.id}')">Pending</button>
          </td>
        </tr>
      `).join("");
    }

    // Expose actions
    window._ack    = (id) => setStatus(id, "acknowledged");
    window._solve  = (id) => setStatus(id, "solved");
    window._pending= (id) => setStatus(id, "pending");

    // Live listener
    let unsub = null;
    function startLive() {
      if (unsub) unsub();
      const q = query(collection(db, "alerts"), orderBy("createdAt", "desc"));
      unsub = onSnapshot(q, snap => {
        const rows = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        draw(rows);
      });
    }

    // Auth
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authStatus.textContent = `Signed in as ${user.email}`;
        startLive();
      } else {
        authStatus.textContent = "Not signed in.";
        if (unsub) { unsub(); unsub = null; }
        bodyEl.innerHTML = "";
      }
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      await signInWithEmailAndPassword(auth, emailEl.value, passEl.value);
      emailEl.value = ""; passEl.value = "";
    });
    logoutBtn.addEventListener("click", () => signOut(auth));
    refreshBtn.addEventListener("click", async () => {
      // manual one-shot refresh if you like
      const q = query(collection(db, "alerts"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      const rows = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      draw(rows);
    });
  </script>
</body>
</html>
